<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montreal Heat Island Effect</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div class="page">
    <main class="story">
      <h1>Temperature and Public Trees in the Different Boroughs of Montreal</h1>
      <p id="status">Loading boroughs...</p>
      <section>
        <details class="chart-panel">
          <summary>
            <h2>Borough Temperatures, Hottest to Coolest</h2>
            <span class="chart-hint chart-hint-show">Show chart</span>
            <span class="chart-hint chart-hint-hide">Hide chart</span>
          </summary>
          <p class="chart-note">Click a borough to find it on the map.</p>
          <div id="chart">Loading chart...</div>
          <p class="chart-note" id="chart-scale">Areas 35.1 °C or higher are classified as heat islands.</p>
        </details>
      </section>
    </main>
    <div id="map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=7"></script>
</body>
</html>

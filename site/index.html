<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montreal Heat Island Effect</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <main class="story">
      <h1>Temperature And Public Trees in The Different Boroughs of Montreal</h1>
      <p id="status">Loading boroughs...</p>
      <section>
        <h2>Borough temperatures, hottest to coolest</h2>
        <p class="chart-note">Click a borough to zoom to it on the map. The last column shows public trees per km².</p>
        <div id="chart">Loading chart...</div>
        <p class="chart-note" id="chart-scale"></p>
      </section>
    </main>
    <div id="map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
